name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,retrieval]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q

  # Eval gate — "CI for model behavior". Fails the PR if a tracked retrieval metric drops
  # more than tolerance below the committed baseline (src/sightline/eval/baseline_metrics.json).
  #
  # The full corpus is gitignored, so CI can't re-run the 1,329-page eval here. Instead:
  #   - the gate LOGIC is unit-tested every PR (tests/test_gate.py, incl. "regression caught");
  #   - metrics are treated as code: a change touching retrieval regenerates metrics locally
  #     (`python -m sightline.eval.run --retriever routed --json current.json`) and the gate
  #     compares them to the baseline. Bumping the baseline is a deliberate, reviewable commit.
  # This job runs the comparator in CI against the committed baseline (green), so the gate
  # code path is exercised on every PR alongside the test that proves it blocks regressions.
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,retrieval]"
      - name: Regression gate
        run: python -m sightline.eval.gate --current src/sightline/eval/baseline_metrics.json
