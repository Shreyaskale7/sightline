name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,retrieval]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q

  # The eval gate (activate in M4): run the golden set and fail the PR if a metric regresses
  # past threshold vs the committed baseline. This is the "regression caught in CI" story.
  eval-gate:
    runs-on: ubuntu-latest
    if: false  # TODO(M4): flip to true once the retriever + baseline metrics are committed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,retrieval]"
      - run: python -m sightline.eval.run
      # TODO(M4): compare against baseline_metrics.json and `exit 1` on regression.
