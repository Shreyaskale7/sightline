[project]
name = "sightline"
version = "0.1.0"
description = "Visual-first document intelligence over SEC filings"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    # Ingestion: PyMuPDF rasterizes PDFs -> PNG and extracts page text (no poppler needed);
    # Playwright (headless Chromium) renders EDGAR's HTML filings -> paginated PDF.
    "pymupdf>=1.24",
    "playwright>=1.44",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # Generation: hosted Claude API for the M1 answer path + eval judge.
    "anthropic>=0.30",
    # Image handling in the visual answer path (downscale page PNGs before sending).
    "pillow>=10.0",
    # Multipart form parsing for the /upload endpoint.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Retrieval (light, CI-friendly): embedded Qdrant + ONNX embeddings + BM25. No torch.
retrieval = [
    "qdrant-client>=1.10",
    "fastembed>=0.3",
    "rank-bm25>=0.2.2",
]
# Visual retrieval + reranking (M2). Pulls torch — heavy; not installed in CI.
visual = [
    "colpali-engine>=0.3",
    "torch>=2.3",
    "sentence-transformers>=3.0",  # cross-encoder reranker
]
# OCR fallback for scanned / image-only uploads (ingest/ocr.py). RapidOCR runs on onnxruntime
# — no torch, no system Tesseract binary, ONNX models bundled in the wheel → offline on CPU.
# Optional: if absent, scanned pages simply aren't indexed (ingestion degrades gracefully).
ocr = [
    "rapidocr-onnxruntime>=1.3",
]
# Orchestration + eval + observability (M3/M4).
llmops = [
    "langgraph>=0.2",
    "ragas>=0.2",
    "langfuse>=2.0",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "respx>=0.21",   # mock httpx in tests
]

[project.scripts]
sightline-ingest = "scripts.ingest:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sightline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
