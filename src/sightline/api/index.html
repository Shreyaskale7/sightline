<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sightline — ask the filings</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; min-height: 100vh;
    background: #0d1117; color: #e6edf3;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: 100%; max-width: 860px; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  h1 .dot { color: #58a6ff; }
  p.sub { color: #8b949e; margin: 0 0 1.5rem; font-size: .95rem; }
  form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  input[type=text] {
    flex: 1; padding: .75rem 1rem; border-radius: 8px;
    border: 1px solid #30363d; background: #161b22; color: inherit; font-size: 1rem;
  }
  input[type=text]:focus { outline: 2px solid #58a6ff; border-color: transparent; }
  button {
    padding: .75rem 1.4rem; border-radius: 8px; border: none; cursor: pointer;
    background: #238636; color: #fff; font-size: 1rem; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: wait; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 1.25rem; margin-bottom: 1rem;
  }
  .abstained { border-left: 4px solid #d29922; }
  .answered  { border-left: 4px solid #238636; }
  .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: #8b949e; }
  .cites { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .cite { background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  .cite img { display: block; width: 100%; height: auto; background: #fff; }
  .cite figcaption { padding: .5rem .75rem; font-size: .8rem; color: #8b949e; word-break: break-all; }
  .examples { color: #8b949e; font-size: .85rem; }
  .examples a { color: #58a6ff; text-decoration: none; cursor: pointer; }
  .spin { color: #8b949e; }
</style>
</head>
<body>
<main>
  <h1>Sightline<span class="dot">.</span></h1>
  <p class="sub">Ask analyst questions about SEC filings (NVDA, AMD, INTC, MU, QCOM — latest 10-K + three 10-Qs each).
  Answers cite the actual page image, or honestly abstain.</p>

  <form id="f">
    <input id="q" type="text" placeholder="e.g. What was NVIDIA's total revenue in its most recent 10-K?" required>
    <button id="go" type="submit">Ask</button>
  </form>

  <p class="examples">Try:
    <a data-q="How much did AMD spend on research and development in its most recent 10-K?">AMD R&amp;D</a> ·
    <a data-q="Which spent more on R&D in its most recent 10-K, NVIDIA or Intel?">NVIDIA vs Intel R&amp;D</a> ·
    <a data-q="How did NVIDIA's quarterly revenue change across its last three 10-Q filings?">NVIDIA revenue trend</a> ·
    <a data-q="What was Broadcom's total revenue in its most recent 10-K?">a question it should refuse</a>
  </p>

  <div id="out"></div>
</main>

<script>
const f = document.getElementById("f"), q = document.getElementById("q"),
      go = document.getElementById("go"), out = document.getElementById("out");

document.querySelectorAll(".examples a").forEach(a =>
  a.addEventListener("click", () => { q.value = a.dataset.q; f.requestSubmit(); }));

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  go.disabled = true;
  out.innerHTML = '<p class="spin">Searching 1,329 pages and reading the winners…</p>';
  try {
    const r = await fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q.value, k: 5 }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    let html = `<div class="card ${d.abstained ? "abstained" : "answered"}">
      <div class="label">${d.abstained ? "abstained — the corpus can't support an answer" : "answer"}</div>
      <p>${escapeHtml(d.answer)}</p></div>`;
    if (d.citations.length) {
      html += `<div class="label" style="margin:.5rem 0">cited pages — the actual evidence</div><div class="cites">`;
      for (const c of d.citations) {
        html += `<figure class="cite"><img loading="lazy" src="${c.image_url}" alt="cited page">
                 <figcaption>${c.accession} · page ${c.page_no}</figcaption></figure>`;
      }
      html += `</div>`;
    }
    out.innerHTML = html;
  } catch (err) {
    out.innerHTML = `<div class="card abstained"><div class="label">error</div><p>${escapeHtml(String(err))}</p></div>`;
  } finally {
    go.disabled = false;
  }
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
}
</script>
</body>
</html>
