# Golden eval set for the M1 text baseline.
# Labels are grounded in the actual ingested pages. Corpus: NVDA/AMD/INTC/MU/QCOM,
# 1 latest 10-K + 3 recent 10-Qs each (20 filings, ~1300 pages). Each company still has
# exactly one 10-K, so "most recent 10-K" phrasing stays unambiguous.
# Figures are in USD millions, taken from each consolidated statement of operations/income.
# Slices: basic, cross_company, multi_hop, unanswerable. (chart_only waits for M2 — charts
